# Yumi 12 关节物理代理配置。关节顺序、零位、观测缩放与 G1 保持一致，
# 使脑网络的 12 维动作 / 47 维观测接口不变，可直接加载现有检查点。
simulation_dt: 0.002
control_decimation: 10

kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

# 与 G1 相同的默认关节角：现有网络权重的观测基准（qpos - home）不变。
default_angles: [-0.1,  0.0,  0.0,  0.3, -0.2, 0.0,
                  -0.1,  0.0,  0.0,  0.3, -0.2, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 47

cmd_init: [0.5, 0, 0]

# Yumi 身体参数（VRM 实测 + 假设，见 yumi.xml 注释）
initial_height: 0.962   # 默认屈膝站姿下的骨盆高度（含髋关节在骨盆下 0.039）
fall_height: 0.55       # 骨盆低于此高度判定跌倒（比例与 G1 的 0.45/0.79 一致）
hips_height: 0.97231    # VRM T-pose 直腿髋高，用于前端显示缩放
